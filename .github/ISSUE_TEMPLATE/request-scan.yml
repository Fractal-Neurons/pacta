name: "Request a Pacta Dossier, Wholesale Sweep, Custom Webhook Alerts, API SLA or Free 7-Day Fix Re-Verification"
description: "Submit non-sensitive public scope for a custom control-plane dossier (by arrangement), a Wholesale Coverage Sweep of 20 or more protocols ($150 / protocol, by arrangement), custom webhook alerts (by arrangement; the result can still be Delta), an enterprise API SLA, or free factual re-verification within 7 days of a merged docs or on-chain fix."
title: "[Pacta Scope] <Organization / Protocol Name>"
labels: ["pacta-intake"]
body:
  - type: markdown
    attributes:
      value: |
        > **PUBLIC ISSUE TRACKER.** Do **not** submit security vulnerabilities, private calldata or keys here.
        > Exploit-sensitive vulnerabilities go through the protocol's Immunefi or Cantina bounty programme.
        >
        > All Pacta public data (indexed records, timelock radar, briefs, `/api/v1/*.json`, `llms.txt`) is free and real-time; nothing below is needed to access it.
  - type: input
    id: repo_or_portfolio_url
    attributes:
      label: "1. Public Smart Contract Repository, Forum Proposal or Curated Vault Portfolio"
      placeholder: "https://github.com/your-org/your-contracts, a Morpho / Euler / Aave / Sky forum proposal, or a public collateral list"
    validations:
      required: true
  - type: textarea
    id: commitments_and_addresses
    attributes:
      label: "2. Public Documentation URL & Deployed Mainnet Contract Addresses"
      placeholder: "Docs: https://docs.yourprotocol.xyz\nPublic Mainnet Addresses (or path to deployments.json): Ethereum Mainnet 0x..."
    validations:
      required: true
  - type: dropdown
    id: package_tier
    attributes:
      label: "3. Track"
      options:
        - "Custom Control-Plane Dossier (by arrangement)"
        - "Wholesale Coverage Sweep — 20 or more protocols ($150 / protocol, by arrangement)"
        - "Custom webhook alerts (by arrangement)"
        - "Enterprise / High-Throughput API SLA (priced on scope)"
        - "Free factual re-verification within 7 days (merged docs or on-chain fix)"
    validations:
      required: true
  - type: dropdown
    id: settlement_preference
    attributes:
      label: "3b. Settlement (paid tracks only)"
      description: "Option A needs no upfront transfer: Pacta issues a formal commercial invoice (PDF) and verified counterparty payment instructions once scope is confirmed."
      options:
        - "Option A: formal commercial invoice (PDF) and counterparty settlement"
        - "Option B: direct on-chain USDC settlement"
    validations:
      required: false
  - type: input
    id: forum_proposal_url
    attributes:
      label: "4. Forum Proposal URL (optional)"
      placeholder: "https://… listing or collateral-onboarding proposal the Curator Diligence Dossier should support"
    validations:
      required: false
  - type: input
    id: payment_tx_hash
    attributes:
      label: "5. USDC Payment Transaction Hash (optional; Option B direct settlement only)"
      description: "USDC on Base or Ethereum to the Pacta treasury (direct settlement EOA) 0x4348DF1BEFAffcbA248B5118B1b782B1B2bdEd14. Leave blank to confirm scope first, or choose Option A for an invoice."
      placeholder: "0x… (66 characters)"
    validations:
      required: false
  - type: input
    id: contact_channel
    attributes:
      label: "6. Public Organization Contact Handle or Email Reference"
      placeholder: "risk@yourorg.xyz or @github-org-handle (do not include sensitive details)"
