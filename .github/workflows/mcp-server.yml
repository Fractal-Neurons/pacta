name: Pacta MCP Server CI & npm Release

on:
  push:
    branches: ["main"]
    paths:
      - "packages/mcp-server/**"
      - ".github/workflows/mcp-server.yml"
  pull_request:
    paths:
      - "packages/mcp-server/**"
      - ".github/workflows/mcp-server.yml"
  workflow_dispatch:
    inputs:
      publish_npm_and_mcp_registry:
        description: "Publish @pacta/mcp-server to npm (the MCP Registry entry is published by publish-mcp.yml)"
        required: true
        type: boolean
        default: false

jobs:
  test-mcp-server:
    name: Run Zero-Dependency MCP Server Suite (Node 22)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run MCP server unit & protocol tests
        working-directory: packages/mcp-server
        run: node --test ./test/server.test.mjs

  publish-mcp-server:
    name: Publish to npm (manual release)
    needs: test-mcp-server
    if: github.event_name == 'workflow_dispatch' && inputs.publish_npm_and_mcp_registry == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 for npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish @pacta/mcp-server to npm
        working-directory: packages/mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      # The MCP Registry entry (io.github.fractal-neurons/pacta) is published only by publish-mcp.yml (pinned,
      # checksum-verified mcp-publisher, remotes-only manifest), so the two workflows never race on a version.
